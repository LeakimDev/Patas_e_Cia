<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patas &amp; Cia — Animais</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>" />
</head>
<body>
  <main class="pagina">
    <nav class="nav-voltar">
      <button id="btn-voltar" class="btn btn--ghost">← Voltar para Tutores</button>
    </nav>

    <header class="pagina-header">
      <div>
        <h1 class="pagina-header__titulo">🐾 Animais</h1>
        <p class="pagina-header__subtitulo">Tutor: <strong id="nome-tutor">Carregando...</strong></p>
      </div>
    </header>

    <section class="secao">
      <div class="secao__cabecalho">
        <h2 class="secao__titulo">🐶 Animais Cadastrados</h2>
        <button id="btn-abrir-modal" class="btn btn--primary">+ Adicionar Animal</button>
      </div>
      <div id="loading" class="loading">Carregando animais...</div>
      <div id="lista-animais" class="lista-cards" hidden></div>
    </section>
  </main>

  <div id="modal-animal" class="modal" role="dialog" aria-modal="true" aria-labelledby="titulo-form-animal" hidden>
    <div class="modal__overlay" id="modal-overlay"></div>
    <div class="modal__container">
      <header class="modal__header">
        <h2 id="titulo-form-animal" class="modal__titulo">Adicionar Animal</h2>
        <button id="btn-fechar-modal" class="modal__fechar" aria-label="Fechar modal">✕</button>
      </header>

      <form id="form-animal" class="modal__corpo" novalidate>
        <div class="form-grid">
          <div class="form-grupo">
            <label for="animal-nome">Nome <span class="obrigatorio">*</span></label>
            <input type="text" id="animal-nome" name="nome" placeholder="Ex: Rex" />
            <span id="erro-animal-nome" class="campo-erro" role="alert"></span>
          </div>

          <div class="form-grupo">
            <label for="animal-especie">Espécie <span class="obrigatorio">*</span></label>
            <input type="text" id="animal-especie" name="especie" placeholder="Ex: Cachorro, Gato, Coelho..." list="especies-sugeridas" />
            <datalist id="especies-sugeridas">
              <option value="Cachorro"></option>
              <option value="Gato"></option>
              <option value="Coelho"></option>
              <option value="Pássaro"></option>
              <option value="Hamster"></option>
              <option value="Peixe"></option>
              <option value="Réptil"></option>
            </datalist>
            <span id="erro-animal-especie" class="campo-erro" role="alert"></span>
          </div>

          <div class="form-grupo">
            <label for="animal-raca">Raça</label>
            <input type="text" id="animal-raca" name="raca" placeholder="Ex: Labrador, Siamês..." />
            <span id="erro-animal-raca" class="campo-erro" role="alert"></span>
          </div>

          <div class="form-grupo">
            <label for="animal-data_nascimento">Data de Nascimento</label>
            <input type="date" id="animal-data_nascimento" name="data_nascimento" />
            <span id="erro-animal-data_nascimento" class="campo-erro" role="alert"></span>
          </div>
        </div>

        <div class="form-acoes">
          <button type="submit" id="btn-submit-animal" class="btn btn--primary">Adicionar Animal</button>
          <button type="button" id="btn-cancelar-edicao" class="btn btn--ghost">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="../js/pages/animaisPage.js"></script>
</body>
</html>
